// ─── MAIN BACKGROUND DRAW ────────────────────
function drawBg() {
  var pv = getPhaseVisual();
  var pi = getPhaseIdx();

  // Base gradient — cached per phase
  if(_bgGradPhase!==pi){ _bgGradPhase=pi; _bgGrad=ctx.createLinearGradient(0,0,0,H); _bgGrad.addColorStop(0,pv.bg[0]); _bgGrad.addColorStop(1,pv.bg[1]); }
  ctx.fillStyle=_bgGrad; ctx.fillRect(0,0,W,H);

  // ── Phase-specific background elements ──
  if(pi === 0) {
    // PHASE 1 — PERPDEX TERMINAL: matrix grid + chart
    ctx.strokeStyle = '#00ff4109'; ctx.lineWidth = 0.5;
    for(var gxi=0; gxi<W; gxi+=36){ ctx.beginPath(); ctx.moveTo(gxi,22); ctx.lineTo(gxi,H); ctx.stroke(); }
    for(var gyi=22; gyi<H; gyi+=36){ ctx.beginPath(); ctx.moveTo(0,gyi); ctx.lineTo(W,gyi); ctx.stroke(); }
    ctx.strokeStyle = '#00ff4120'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(var cx2=0; cx2<=W; cx2+=4) {
      var cy2 = H*0.42 + Math.sin((cx2+frame*0.4)*0.04)*55 + Math.cos((cx2+frame*0.22)*0.025)*30;
      cx2===0 ? ctx.moveTo(cx2,cy2) : ctx.lineTo(cx2,cy2);
    }
    ctx.stroke();
    ctx.font = '9px Courier New';
    var chars = ['0','1','$','%','+','8','3','-'];
    for(var mi=0; mi<14; mi++) {
      var mx3 = (mi*37+3) % W;
      var my3 = ((mi*83 + frame*(1+(mi%3))) % (H-100) + H-100) % (H-100) + 22;
      ctx.globalAlpha = 0.1 + (mi%4)*0.04;
      ctx.fillStyle = '#00ff41';
      ctx.fillText(chars[(mi+Math.floor(frame/18+mi))%chars.length], mx3, my3);
    }
    ctx.globalAlpha = 1;

  } else if(pi === 1) {
    // PHASE 2 — BASE NETWORK: sunny sky + clouds
    drawSunnyBlueSkyBg();

  } else if(pi === 2) {
    // PHASE 3 — TO THE MOON: mountains + snow
    drawMountainBackground();
    drawClouds(0.18);

  } else if(pi === 3) {
    // PHASE 4 — CRYPTO FOREST: pine trees + drizzle
    drawForestTrees();
    var lakeY = H - 180;
    var lake = ctx.createLinearGradient(0, lakeY, 0, lakeY+40);
    lake.addColorStop(0, '#1a3a4a66'); lake.addColorStop(1, '#0a1e2a44');
    ctx.fillStyle = lake; ctx.fillRect(0, lakeY, W, 40);
    ctx.strokeStyle = '#4a8aaa55'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,lakeY); ctx.lineTo(W,lakeY); ctx.stroke();
    var fog = ctx.createLinearGradient(0, H-200, 0, H-80);
    fog.addColorStop(0,'transparent'); fog.addColorStop(1,'#b0d8f018');
    ctx.fillStyle = fog; ctx.fillRect(0, H-200, W, 120);
    drawDrizzle();

  } else if(pi === 4) {
    // PHASE 5 — HEAVEN'S GATE: titan face + pillars + faint rays
    drawHeavenPillars();
    drawHeavenRays();
    drawTitanFaceBg();
    if(!_heavenMist){_heavenMist=ctx.createLinearGradient(0,H-200,0,H-80);_heavenMist.addColorStop(0,'transparent');_heavenMist.addColorStop(1,'#FFD70028');}
    ctx.fillStyle=_heavenMist; ctx.fillRect(0,H-200,W,120);

  } else if(pi === 5) {
    // PHASE 6 — DUNGEON CASTLE: ghosts + chains + stone atmosphere
    drawGhostDungeonBg();

  } else if(pi === 6) {
    // PHASE 7 — OUTER SPACE: planets + asteroids
    drawSpacePlanetsBg();
    drawAsteroids();

  } else if(pi === 7) {
    // PHASE 8 — CELESTIAL DESERT: colossal ruins + moon + desert + poison rain
    drawCelestialDesertBg();
    drawPoisonDrops();

  } else if(pi === 8) {
    // PHASE 9 — VOLCANO: lava + eruption
    drawVolcanoBg();

  } else if(pi === 9) {
    // PHASE 10 — COINBASE PLANET: sunny + money + fireworks
    drawCoinbasePlanetBg();
  }

  // Ticker top bar
  drawTicker(pv);

  // Ground
  drawGround(pv);

  // Phase name bottom-right
  ctx.fillStyle = pv.glowColor + '55'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'right';
  ctx.fillText(pv.name, W-10, H-62);
}

// ─── BANNER DE FASE — animação dramática ──────
function drawPhaseBanner() {
  // banner só existe enquanto o jogo estiver congelado
  if(!phasePaused || phaseFlash <= 0) { phaseFlash = 0; return; }
  phaseFlash--;
  var ph = getPhase();
  var pv = getPhaseVisual();
  var t  = phaseFlash; // 190→0

  // Fases da animação:
  // 190-160: flash branco + slide entrada (30f)
  // 160-60:  exibição plena (100f)
  // 60-0:    fade out (60f)

  var fadeIn  = t > 160 ? (190-t)/30 : 1;          // 0→1 nos primeiros 30f
  var fadeOut = t < 60  ? t/60        : 1;          // 1→0 nos últimos 60f
  var alpha   = fadeIn * fadeOut;
  if(alpha <= 0) return;

  // Slide vertical: entra do topo nos primeiros 30f
  var slideY = t > 160 ? -(1-(190-t)/30)*60 : 0;

  ctx.save();
  ctx.translate(0, slideY);

  // Flash branco rápido nos primeiros 15f
  if(t > 175){
    ctx.globalAlpha = ((t-175)/15) * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  // Overlay escuro central (sem criar gradiente — só fillRect)
  ctx.globalAlpha = alpha * 0.78;
  ctx.fillStyle = '#000510';
  ctx.beginPath(); ctx.roundRect(0, H/2-82, W, 164, 0); ctx.fill();

  // Linha colorida superior e inferior (substituem shadowBlur)
  ctx.globalAlpha = alpha;
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(0, H/2-82, W, 3);
  ctx.fillRect(0, H/2+79, W, 3);

  // Barra de cor fina no centro
  ctx.globalAlpha = alpha * 0.3;
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(0, H/2-82, W, 164);
  ctx.globalAlpha = alpha;

  // "NOVA FASE" pequeno acima
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff66';
  ctx.font = 'bold 11px Courier New';
  ctx.fillText('✦  NEW PHASE  ✦', W/2, H/2-52);

  // Label da fase (PHASE 3) — grande
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 15px Courier New';
  ctx.fillText(ph.label, W/2, H/2-32);

  // Nome da fase — destaque máximo
  ctx.fillStyle = pv.glowColor;
  ctx.font = 'bold 28px Arial';
  // Camada de brilho falso (sem shadowBlur): texto levemente maior + alpha baixo
  ctx.globalAlpha = alpha * 0.25;
  ctx.font = 'bold 32px Arial';
  ctx.fillText(pv.name, W/2, H/2+8);
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 28px Arial';
  ctx.fillText(pv.name, W/2, H/2+8);

  // Velocidade + barra de progresso de fase
  ctx.fillStyle = '#ffffff88';
  ctx.font = '11px Courier New';
  ctx.fillText('speed  ' + ph.speed.toFixed(1) + 'x', W/2, H/2+32);

  // Barra de progresso (fase atual / total)
  var pi = getPhaseIdx();
  var barW = 160, barH = 4, barX = W/2 - barW/2, barY = H/2+48;
  ctx.fillStyle = '#ffffff22';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(barX, barY, barW * ((pi+1)/PHASES.length), barH);

  // Nível em texto abaixo da barra
  ctx.fillStyle = '#ffffff44';
  ctx.font = '9px Courier New';
  ctx.fillText((pi+1) + ' / ' + PHASES.length + ' phases', W/2, H/2+64);

  ctx.restore();
}

// ─── PARTÍCULAS ──────────────────────────────
function spawnParticles(x, y, color, n) {
  n = n || 8;
  if(particles.length > 18) return;
  for(var i=0; i<n; i++)
    particles.push({x:x, y:y, vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7, life:40, color:color});
}
function updateParticles() {
  particles = particles.filter(function(p){ return p.life>0; });
  for(var i=0; i<particles.length; i++){
    var p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
    ctx.globalAlpha = p.life/40;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── COLISÃO ─────────────────────────────────
function hitTestPipes() {
  var r = 14;
  for(var i=0; i<pipes.length; i++){
    var p = pipes[i];
    if(bleu.x+r > p.x && bleu.x-r < p.x+p.bodyW){
      if(bleu.y-r < p.topH) return true;
      if(bleu.y+r > p.botY) return true;
    }
  }
  return false;
}
function hitTest() {
  return hitTestPipes() || bleu.y+14 > H-80 || bleu.y-14 < 22;
}

// ─── LOOP PRINCIPAL ──────────────────────────
var _lastT=0;
function loop(ts) {
  requestAnimationFrame(loop);
  var dt = ts - _lastT;
  if(dt < 16) return; // cap 60fps — saves CPU/battery on 90/120Hz phones
  _lastT = ts;
  frame++;
  drawBg();
  ctx.save();
  if(screenShake>0){ctx.translate((Math.random()-.5)*screenShake*2,(Math.random()-.5)*screenShake*.7);}

  // ── DAILY MODAL ──
  if(dailyModal){ drawDailyModal(); return; }

  // ── IDLE ──
  if(gameState === 'idle'){
    drawIdleTabs();
    if(idleTab==='play'){
      drawIdleParticles();
      drawCharacter(bleu.x, bleu.y + Math.sin(frame*.045)*8, frame*.22, 0);
      ctx.textAlign = 'center';

      // ── Title ──
      ctx.font = 'bold 34px Courier New';
      var tg = ctx.createLinearGradient(W/2-80, 0, W/2+80, 0);
      tg.addColorStop(0,'#0052FF'); tg.addColorStop(0.5,'#00D4FF'); tg.addColorStop(1,'#FFD700');
      ctx.fillStyle = tg; ctx.shadowColor = '#0052FF'; ctx.shadowBlur = 28;
      ctx.fillText('FLAPY BLEU', W/2, H/2-82); ctx.shadowBlur = 0;

      // ── WEB3 GAME pill badge ──
      var badgePulse = 0.92+0.08*Math.sin(frame*0.07);
      ctx.save(); ctx.translate(W/2, H/2-62); ctx.scale(badgePulse, badgePulse);
      ctx.fillStyle='#0052FF33'; ctx.strokeStyle='#0052FFaa'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(-58,-10,116,20,10); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#00D4FF'; ctx.font='bold 9px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⬡  WEB3 GAME  ·  BASE NETWORK', 0, 0);
      ctx.textBaseline='alphabetic'; ctx.restore();

      // ── Sub tagline ──
      ctx.fillStyle = '#ffffff66'; ctx.font = '11px Courier New';
      ctx.fillText('tap / SPACE to fly  ·  dodge the candles', W/2, H/2-30);

      // ── BEST score ──
      if(highScore > 0){
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 13px Courier New';
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 12;
        ctx.fillText('BEST: ' + highScore, W/2, H/2+44); ctx.shadowBlur = 0;
      }

      drawCharSelect();

      // ── Wallet section — prominent ──
      var wy0 = H/2+66;
      if(walletAddress){
        // Connected state — green badge
        ctx.fillStyle='#00FF8822'; ctx.strokeStyle='#00FF8877'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.roundRect(W/2-100,wy0,200,32,10); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#00FF88'; ctx.font='bold 11px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('⛓ '+walletShort+' · connected', W/2, wy0+16);
        ctx.textBaseline='alphabetic';
        ctx.fillStyle='#00FF8866'; ctx.font='8px Courier New';
        ctx.fillText('scores saved on Base', W/2, wy0+40);
      } else {
        // Not connected — pulsing CTA button
        var wp = 0.97+0.03*Math.sin(frame*0.10);
        ctx.save(); ctx.translate(W/2, wy0+16); ctx.scale(wp,wp);
        ctx.fillStyle='#0052FF';
        ctx.beginPath(); ctx.roundRect(-100,-16,200,32,10); ctx.fill();
        ctx.strokeStyle='#00D4FF66'; ctx.lineWidth=1.5; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 12px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('💎  CONNECT WALLET', 0, 0);
        ctx.textBaseline='alphabetic'; ctx.restore();
        ctx.fillStyle='#ffffff33'; ctx.font='8px Courier New'; ctx.textAlign='center';
        ctx.fillText('save scores · global ranking', W/2, wy0+40);
      }

      // ── Powered by ──
      ctx.fillStyle = '#0052FF66'; ctx.font = '9px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('powered by Base Network', W/2, H-82);
    } else if(idleTab==='shop'){
      drawShopTab();
    } else if(idleTab==='skins'){
      drawSkinsTab();
    } else if(idleTab==='leaderboard'){
      drawLeaderboardTab();
    }
    return;
  }


  // ── PLAYING ──
  if(gameState === 'playing' && !shopOverlay && !paused){

    var ph  = getPhase();
    var pi  = getPhaseIdx();
    var pv  = getPhaseVisual();

    // ── Física congelada durante transição de fase ──
    if(phasePaused){
      // desbloqueia quando animação entra no fade-out (phaseFlash < 80) ou player toca
      if(phaseFlash < 80){ phasePaused = false; phaseFlash = 0; }
    } else {
      bleu.vy   += 0.38;
      bleu.y    += bleu.vy;
    }
    bleu.flap += 0.25;

    // spawn de pipes — progressivamente mais frequente
    var spawnEvery = Math.max(52, 86 - pi * 3);
    if(!phasePaused && frame % spawnEvery === 0){
      pipes.push(makePipe(W+10));
    }

    // ─── STAR POWER-UP spawn ─────────────────
    var spd = phasePaused ? 0 : ph.speed * (starPower > 0 ? 1.55 : 1); // 0 congela tudo durante transição
    // Estrela: rara, só aparece sem escudo na tela e sem sobreposição
    if(frame % 420 === 60 && Math.random() < 0.12 && starPower === 0 && shieldItems.length === 0) {
      var sy2 = lastGapCenter + (Math.random() - 0.5) * 40;
      sy2 = Math.max(80, Math.min(H - 110, sy2));
      stars.push({x: W+18, y: sy2});
    }
    // Move stars + collect
    for(var si=stars.length-1; si>=0; si--) {
      stars[si].x -= spd;
      if(stars[si].x < -20) { stars.splice(si,1); continue; }
      drawStarItem(stars[si].x, stars[si].y);
      var sdx=stars[si].x-bleu.x, sdy=stars[si].y-bleu.y;
      if(Math.sqrt(sdx*sdx+sdy*sdy) < 26) {
        starPower = 300;
        stars.splice(si,1);
        spawnParticles(bleu.x,bleu.y,'#00D4FF',12);
        spawnParticles(bleu.x,bleu.y,'#ffffff',8);
        startStarMusic();
        if(navigator.vibrate) navigator.vibrate([30,20,60]);
      }
    }
    if(starPower>0){ starPower--;
      // ── Speed lines — desvanece nos últimos 60f e reseta ao acabar ──
      var slFade = starPower < 60 ? starPower/60 : 1;
      ctx.lineCap='round';
      for(var sl=0;sl<speedLines.length;sl++){
        var line=speedLines[sl];
        line.y += (Math.random()-0.5)*1.2;
        if(line.x===undefined) line.x = W+10;
        line.x -= line.speed * 2.8;
        if(line.x < -line.len) line.x = W + 10;
        ctx.globalAlpha = line.alpha * slFade;
        ctx.strokeStyle = sl%3===0 ? '#00D4FF' : sl%3===1 ? '#ffffff' : '#0052FF';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(line.x+line.len, line.y); ctx.lineTo(line.x, line.y); ctx.stroke();
      }
      ctx.globalAlpha=1; ctx.lineCap='butt';
      // Aura neon azul ao redor do personagem
      ctx.globalAlpha=(0.18+0.1*Math.sin(frame*0.3))*slFade;
      ctx.fillStyle='#00D4FF';
      ctx.beginPath(); ctx.arc(bleu.x,bleu.y,30,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      // Quando acabar: reset x das linhas e volta música
      if(starPower===0){
        for(var sl2=0;sl2<speedLines.length;sl2++) delete speedLines[sl2].x;
        stopStarMusic();
      }
    }
    if(invincible>0) invincible--;
    if(shieldBreak>0) shieldBreak--;
    // Estrela E invencibilidade: quica nos limites em vez de cair fora da tela
    if(starPower>0 || invincible>0){
      if(bleu.y+14 > H-80){ bleu.y = H-80-14; bleu.vy = -Math.abs(bleu.vy)*0.6; }
      if(bleu.y-14 < 22)  { bleu.y = 22+14;   bleu.vy =  Math.abs(bleu.vy)*0.6; }
    }

    // ─── SHIELD spawn + move + coleta ────────
    // Escudo: só aparece sem estrela na tela e sem sobreposição
    if(frame % 280 === 140 && Math.random() < 0.28 && shield===0 && starPower===0 && stars.length===0) {
      var shy = lastGapCenter + (Math.random()-0.5)*50;
      shy = Math.max(80, Math.min(H-110, shy));
      shieldItems.push({x: W+18, y: shy});
    }
    for(var shi=shieldItems.length-1; shi>=0; shi--){
      shieldItems[shi].x -= spd;
      if(shieldItems[shi].x < -20){ shieldItems.splice(shi,1); continue; }
      drawShieldItem(shieldItems[shi].x, shieldItems[shi].y);
      var shDx=shieldItems[shi].x-bleu.x, shDy=shieldItems[shi].y-bleu.y;
      if(Math.sqrt(shDx*shDx+shDy*shDy)<26){
        shield=1; shieldItems.splice(shi,1);
        spawnParticles(bleu.x,bleu.y,'#00FF88',10);
        spawnParticles(bleu.x,bleu.y,'#ffffff',6);
        beep(440,880,0.12,'sine',0.18);
        beep(660,1320,0.10,'sine',0.16);
        if(navigator.vibrate) navigator.vibrate([20,10,40]);
      }
    }

    // move pipes
    for(var i=0; i<pipes.length; i++){
      var p = pipes[i];
      p.x -= spd;
      if(!p.passed && p.x+p.bodyW < bleu.x){
        p.passed = true; score++; scorePop = 12; scoreGlow = 14;
        combo++; comboFlash=22; coinsThisRun++;
        if(navigator.vibrate) navigator.vibrate(10);
        // som de moeda: ping metálico curto
        beep(1400, 1800, 0.07, 'sine', 0.06);
        setTimeout(function(){ beep(1800, 1400, 0.05, 'sine', 0.04); }, 40);
        // escalating pitch with combo
        var pitch = Math.min(260 + score*14, 900);
        beep(pitch, pitch*2, 0.12, 'sine', 0.10);
        if(combo===3){ beep(pitch*1.5, pitch*3, 0.14, 'sine', 0.08); screenShake=4; }
        if(combo===5){ beep(880, 1760, 0.22, 'square', 0.08); screenShake=6; spawnScorePopup(bleu.x,bleu.y-55,'🔥 FEVER!'); }
        if(combo===10){ beep(1047, 2093, 0.28, 'square', 0.1); screenShake=8; spawnScorePopup(bleu.x,bleu.y-55,'💎 x10 ULTRA!'); }
        spawnScorePopup(bleu.x, bleu.y-25);
        // milestone bonus
        if(MILESTONES[milestoneIdx] && score>=MILESTONES[milestoneIdx]){
          var bonus = MILESTONES[milestoneIdx]*2;
          coinCount+=bonus; localStorage.setItem('bleuCoins',coinCount);
          spawnScorePopup(bleu.x, bleu.y-55, '+'+bonus+' 🐉 BONUS!');
          beep(880,1760,0.35,'sine',0.18);
          screenShake=8;
          milestoneIdx++;
          if(navigator.vibrate) navigator.vibrate([50,20,50,20,80]);
        }
        // record mid-game flash
        if(score>highScore && !newRecord) recFlash=55;

        // phase change detection
        var newPI = getPhaseIdx();
        if(newPI > lastPhaseIdx) {
          _bgGradPhase=-1; completedPhase = lastPhaseIdx;
          lastPhaseIdx = newPI;
          phaseFlash   = 190;
          phasePaused  = true;
          if(newPI > runPhase) runPhase = newPI;
          bleu.vy = 0;
          bleu.y  = H / 2;
          // clear screen and center gap so player has safe passage on transition
          pipes = []; stars = []; shieldItems = [];
          lastGapCenter = H / 2;
          startMusic(newPI);
          spawnParticles(W/2, H/2, '#FFD700', 30);
          spawnParticles(W/2, H/2, '#00D4FF', 20);
          var fs = [440,554,659,880];
          fs.forEach(function(f,ii){ setTimeout(function(){ beep(f,f*1.5,0.2,'sine',0.18); }, ii*80); });
          // NFT unlock at phase 10 (score >= 100 in test mode)
          if(newPI >= 9 && unlockedChars < 2) { // phase 10 reached (score >= 36 in test mode)
            unlockedChars = 2;
            localStorage.setItem('bleuChars', '2');
            nftFlash = 220;
            spawnParticles(W/2, H/2, '#FF6B20', 40);
            spawnParticles(W/2, H/2, '#FFD700', 40);
            [523,659,784,1047,1319].forEach(function(f,ii){
              setTimeout(function(){ beep(f,f*1.2,0.25,'sine',0.2); }, ii*100);
            });
          }
          { chestType=(newPI===9)?'rare':(newPI>=6)?'gold':'normal'; gameState='award'; chestClicks=0;chestBounce=0;chestOpened=false;chestCoins=0;chestOpenAnim=0;bleu.vy=0; }
        }
      }
    }
    pipes = pipes.filter(function(p){ return p.x > -70; });

    // ── COINS: spawn ──
    if(frame % 140 === 70) {
      var cy0 = 80 + Math.random() * (H - 220);
      coins.push({ x: W + 14, y: cy0, collected: false, pulse: frame });
    }
    // ── COINS: move + collect + draw ──
    var spd2 = getPhase().speed;
    for(var ci3 = coins.length - 1; ci3 >= 0; ci3--) {
      var coin = coins[ci3];
      coin.x -= spd2;
      if(coin.x < -20) { coins.splice(ci3, 1); continue; }
      if(!coin.collected) {
        var dx3 = bleu.x - coin.x, dy3 = bleu.y - coin.y;
        if(Math.sqrt(dx3*dx3 + dy3*dy3) < 23) {
          coin.collected = true;
          coinCount++; coinsThisRun++;
          localStorage.setItem('bleuCoins',coinCount);
          spawnParticles(coin.x, coin.y, '#88ccff', 8);
          spawnParticles(coin.x, coin.y, '#ffffff', 4);
          beep(880, 1320, 0.12, 'sine', 0.1);
          coins.splice(ci3, 1); continue;
        }
      }
      // Bob animation
      var bob = Math.sin((frame - coin.pulse) * 0.06) * 3;
      drawCoin(coin.x, coin.y + bob);
    }

    for(var i=0; i<pipes.length; i++) drawObstacle(pipes[i]);
    ctx.save();
    if(scoreGlow>0) scoreGlow--;
    if(bleuSquish>0){var _sq=bleuSquish/8;ctx.translate(bleu.x,bleu.y);ctx.scale(1+_sq*.2,1-_sq*.18);ctx.translate(-bleu.x,-bleu.y);bleuSquish--;}
    // blink when invincible (every 6f) or star power (every 8f)
    var _blink = (invincible>0 && Math.floor(invincible/6)%2===0) || (starPower>0 && Math.floor(frame/8)%2===0);
    if(!_blink) drawCharacter(bleu.x, bleu.y, bleu.flap, bleu.vy);
    ctx.restore();
    updateParticles();
    updateScorePopups();
    drawPhaseBanner();
    drawNFTBanner();

    // HUD — score
    ctx.textAlign = 'center';
    var _ps = scorePop>0 ? 1+(scorePop/12)*0.6 : 1;
    ctx.save(); ctx.translate(W/2,52); ctx.scale(_ps,_ps);
    ctx.font = 'bold 26px Courier New';
    ctx.fillStyle = pv.glowColor;
    ctx.fillText(score, 0, 0);
    ctx.restore();
    if(scorePop>0) scorePop--;
    // Pause button
    ctx.fillStyle='#ffffff18'; ctx.strokeStyle='#ffffff33'; ctx.lineWidth=1;
    ctx.fillRect(W-36,6,26,20); ctx.strokeRect(W-36,6,26,20);
    ctx.fillStyle='#ffffffaa'; ctx.font='bold 10px Courier New'; ctx.textAlign='left';
    ctx.fillText(paused?'▶':'II',W-30,20);
    // HUD — coin counter (top right)
    drawCoin(W - 38, 34);
    ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#d8f4ff'; ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(coinCount, W - 24, 39);
    ctx.shadowBlur = 0;
    // progress bar — top left, below ticker
    var progress = (score % 4) / 4;
    ctx.fillStyle = '#ffffff14';
    ctx.fillRect(6, 23, 70, 3);
    var barG = ctx.createLinearGradient(6, 23, 76, 23);
    barG.addColorStop(0,'#FFD700'); barG.addColorStop(1,'#00D4FF');
    ctx.fillStyle = barG;
    ctx.fillRect(6, 23, 70 * progress, 3);
    // lives + star power HUD
    drawLivesHUD();
    // best
    if(highScore > 0){
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff44'; ctx.font = '10px Courier New';
      ctx.fillText('best ' + highScore, W/2, 68);
    }
    // combo HUD
    if(comboFlash > 0){
      var ca = Math.min(1, comboFlash/12);
      var cscale = 1 + (comboFlash>18 ? (comboFlash-18)*0.04 : 0);
      ctx.save();
      ctx.globalAlpha = ca;
      ctx.translate(W/2, 84);
      ctx.scale(cscale, cscale);
      ctx.textAlign = 'center';
      if(combo>=5){
        ctx.fillStyle = '#ff4488'; ctx.font = 'bold 16px Courier New';
        ctx.shadowColor = '#ff0088'; ctx.shadowBlur = 18;
      } else if(combo>=3){
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Courier New';
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = '#00D4FF'; ctx.font = 'bold 12px Courier New';
        ctx.shadowBlur = 0;
      }
      ctx.fillText((combo>=5?'🔥 ':combo>=3?'⚡ ':'x')+combo+(combo>=5?' FEVER!':combo>=3?' COMBO!':''), 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
      comboFlash--;
    } else { comboFlash=0; }
    // recFlash — mid-game "NOVO RECORDE!" 
    if(recFlash > 0){
      var ra = Math.min(1, recFlash/18) * (recFlash>8?1:recFlash/8);
      ctx.save();
      ctx.globalAlpha = ra;
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px Courier New';
      ctx.fillStyle = '#FFD700';
      ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 20;
      ctx.fillText('🏆 NEW RECORD!', W/2, H/2-70);
      ctx.shadowBlur = 0;
      ctx.restore();
      recFlash--;
    }

    // Bounds (chão/teto) matam sempre — mesmo com invencível/star power
    var _hitBounds = !phasePaused && starPower===0 && invincible===0 && (bleu.y+14 > H-80 || bleu.y-14 < 22);
    // Canos só importam quando não está protegido
    var _hitPipes  = !phasePaused && starPower===0 && invincible===0 && hitTestPipes();
    if(gameState==='playing' && (_hitBounds || _hitPipes)){
      // Escudo absorve QUALQUER batida — nunca perde escudo E vida ao mesmo tempo
      if(shield>0){
        shield=0; shieldBreak=10; invincible=140;
        if(_hitBounds){ bleu.y=H/2; bleu.vy=-3; } // tira do limite
        spawnParticles(bleu.x,bleu.y,'#00FF88',12);
        spawnParticles(bleu.x,bleu.y,'#ffffff',8);
        screenShake=5;
        beep(180,90,0.4,'sawtooth',0.2);
        if(navigator.vibrate) navigator.vibrate([40,20,40]);
      } else {
      spawnParticles(bleu.x, bleu.y, '#FF1744', 10);
      if(navigator.vibrate) navigator.vibrate(60);
      if(lives > 1) {
        // Perde uma vida — pausa e espera o jogador tocar para continuar
        lives--;
        screenShake = 8; hitFlash = 6;
        combo = 0; comboFlash = 0;
        beep(220, 100, 0.3, 'sawtooth', 0.22);
        if(navigator.vibrate) navigator.vibrate([60,20,60]);
        // Reposiciona no centro da tela para dar chance durante a invencibilidade
        bleu.y = H / 2;
        bleu.vy = 0;
        gameState = 'hurt'; // para o jogo até o jogador tocar
      } else {
        // Sem vidas — morte real
        lives = 0;
        spawnParticles(bleu.x, bleu.y, '#FFD700', 10);
        beep(350, 60, 0.5, 'sawtooth', 0.25);
        if(score > highScore){
          highScore = score; newRecord = true;
          localStorage.setItem('bleuHS', highScore);
          [523,659,784,1047].forEach(function(f,i){
            setTimeout(function(){ beep(f,f,0.15,'sine',0.14); }, i*85);
          });
        }
        lastScore=score; localStorage.setItem('bleuLastScore',lastScore); totalScore+=score; localStorage.setItem('bleuTotal',totalScore);
        if(score>0) top5=saveTop5(score);
        if(runPhase > bestPhaseEver){ bestPhaseEver=runPhase; localStorage.setItem('bleuBestPhase', bestPhaseEver); }
        gameState='dead'; screenShake=14; hitFlash=8; stopMusic();
        if(score>0) submitWalletScore(score); // salva score com wallet (se conectada)
        if(comboBest<combo) comboBest=combo;
        combo=0; comboFlash=0; milestoneIdx=0;
        if(navigator.vibrate) navigator.vibrate([80,30,80]);
      }
      } // fecha else do shield
    }
  }

  // ── AWARD ──
  // ── HURT — perdeu uma vida, aguarda toque ──
  if(gameState === 'hurt'){
    for(var i=0;i<pipes.length;i++) drawObstacle(pipes[i]);
    drawCharacter(bleu.x, bleu.y, bleu.flap, 0);
    updateParticles();
    // painel escurecido
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    // coração partido
    ctx.textAlign='center'; ctx.font='bold 44px Arial';
    ctx.fillText('💔', W/2, H/2-50);
    // texto
    ctx.font='bold 18px Courier New'; ctx.fillStyle='#FF4466';
    ctx.fillText('YOU LOST A LIFE!', W/2, H/2+2);
    ctx.font='bold 13px Courier New'; ctx.fillStyle='#ffffff99';
    ctx.fillText('lives remaining: '+lives, W/2, H/2+26);
    // botão continuar pulsando
    var _hp = 1 + 0.06*Math.sin(frame*0.12);
    ctx.save(); ctx.translate(W/2, H/2+72); ctx.scale(_hp,_hp);
    ctx.fillStyle='#0052FF'; ctx.strokeStyle='#00D4FF'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(-80,-18,160,36,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 14px Courier New'; ctx.textBaseline='middle';
    ctx.fillText('▶  CONTINUAR', 0, 0); ctx.textBaseline='alphabetic';
    ctx.restore();
    // corações no HUD também
    drawLivesHUD();
  }
  // ── AWARD ──
  if(gameState === 'award'){
    for(var i=0;i<pipes.length;i++) drawObstacle(pipes[i]);
    drawCharacter(bleu.x, bleu.y, bleu.flap, 0);
    updateParticles();
    drawAwardScreen();
  }
  // ── DEAD ──
  if(gameState === 'dead'){
    for(var i=0; i<pipes.length; i++) drawObstacle(pipes[i]);
    drawCharacter(bleu.x, bleu.y+4, bleu.flap, bleu.vy);
    updateParticles();
    ctx.textAlign = 'center';
    if(newRecord){
      ctx.fillStyle = '#FFD700'; ctx.font = 'bold 15px Courier New';
      ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 24;
      ctx.fillText('NEW RECORD!', W/2, H/2-92);
      ctx.shadowBlur = 0;
    }
    // ── painel principal ──
    ctx.fillStyle = 'rgba(0,5,20,0.80)';
    ctx.beginPath(); ctx.roundRect(W/2-118, H/2-88, 236, 268, 14); ctx.fill();
    ctx.strokeStyle = '#0052FF44'; ctx.lineWidth = 1.5;
    ctx.stroke();

    // REKT
    ctx.font = 'bold 30px Courier New';
    ctx.shadowColor = '#FF1744'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#FF1744'; ctx.textAlign = 'center';
    ctx.fillText('REKT', W/2, H/2-54);
    ctx.shadowBlur = 0;

    // Score grande
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Courier New';
    ctx.fillText(score, W/2, H/2-22);
    ctx.fillStyle = '#ffffff55'; ctx.font = '10px Courier New';
    ctx.fillText('SCORE', W/2, H/2-8);

    // Fase alcançada esta run
    var phaseName = PHASE_VISUALS[runPhase] ? PHASE_VISUALS[runPhase].name : PHASE_VISUALS[0].name;
    ctx.fillStyle = '#00D4FF'; ctx.font = 'bold 11px Courier New';
    ctx.fillText('📍 ' + phaseName, W/2, H/2+10);

    // Melhor fase histórica
    if(bestPhaseEver > 0 && PHASE_VISUALS[bestPhaseEver]){
      ctx.fillStyle = '#ffffff44'; ctx.font = '10px Courier New';
      ctx.fillText('best phase: ' + PHASE_VISUALS[bestPhaseEver].name, W/2, H/2+24);
    }

    // Combo + moedas
    var extraY = H/2+38;
    if(comboBest >= 2){
      ctx.fillStyle = comboBest>=5?'#ff4488':comboBest>=3?'#FFD700':'#00D4FF';
      ctx.font = 'bold 11px Courier New';
      ctx.fillText('combo x' + comboBest, W/2, extraY); extraY+=14;
    }
    if(coinsThisRun > 0){
      ctx.fillStyle = '#FFD700'; ctx.font = '11px Courier New';
      ctx.fillText('🐉 +' + coinsThisRun + ' coins', W/2, extraY); extraY+=14;
    }

    // Novo recorde
    if(newRecord){
      ctx.fillStyle='#FFD700'; ctx.font='bold 12px Courier New';
      ctx.shadowColor='#FFD700'; ctx.shadowBlur=14;
      ctx.fillText('🏆 NEW RECORD!', W/2, extraY); extraY+=14;
      ctx.shadowBlur=0;
    }

    // Top 5
    var medals=['🥇','🥈','🥉','④','⑤'];
    var t5=loadTop5();
    ctx.font='bold 10px Courier New';
    for(var ti=0;ti<Math.min(t5.length,5);ti++){
      ctx.fillStyle = ti===0?'#FFD700': ti===1?'#C0C0C0': ti===2?'#cd7f32':'#ffffff55';
      ctx.globalAlpha = ti===0?1:0.75-ti*0.1;
      ctx.fillText(medals[ti]+' '+t5[ti], W/2, extraY+ti*13);
    }
    ctx.globalAlpha=1;

    // ── Botão COMPARTILHAR ──
    var shareY = H/2+138;
    var shareCol = shareFlash>0 ? '#00CC66' : '#0052FF';
    ctx.fillStyle = shareCol+'22';
    ctx.beginPath(); ctx.roundRect(W/2-74, shareY-16, 148, 30, 8); ctx.fill();
    ctx.strokeStyle = shareCol+'88'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle = shareFlash>0 ? '#00FF88' : '#00D4FF';
    ctx.font = 'bold 12px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(shareFlash>0 ? '✓ COPIED!' : '🔗 SHARE', W/2, shareY+1);
    ctx.textBaseline='alphabetic';

    // ── Botão JOGAR DE NOVO ──
    var pulse2 = 0.97 + 0.03*Math.sin(frame*0.12);
    ctx.save(); ctx.translate(W/2, H/2+178); ctx.scale(pulse2, pulse2);
    ctx.fillStyle = '#0052FF';
    ctx.beginPath(); ctx.roundRect(-78,-17,156,34,10); ctx.fill();
    ctx.font='bold 14px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.fillText('▶ PLAY AGAIN', 0, 0);
    ctx.textBaseline='alphabetic'; ctx.restore();

    // ── Botão MENU ──
    ctx.fillStyle='#ffffff08';
    ctx.beginPath(); ctx.roundRect(W/2-50, H/2+202, 100, 26, 8); ctx.fill();
    ctx.strokeStyle='#0052FF33'; ctx.lineWidth=1; ctx.stroke();
    ctx.font='11px Courier New'; ctx.fillStyle='#0052FFaa';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⌂  MENU', W/2, H/2+215);
    ctx.textBaseline='alphabetic';
    ctx.fillStyle='#ffffff18'; ctx.font='9px Courier New';
    ctx.fillText('$BLEU never stops', W/2, H/2+238);

    // ── Wallet onchain section ──
    var wdy = H/2+248;
    if(walletAddress){
      // Score saved on Base — green confirmation block
      var wdPulse = 0.92+0.08*Math.sin(frame*0.08);
      ctx.save(); ctx.translate(W/2, wdy+14); ctx.scale(wdPulse, wdPulse);
      ctx.fillStyle='#00FF8818'; ctx.strokeStyle='#00FF8866'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(-108,-14,216,30,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#00FF88'; ctx.font='bold 10px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⛓  SCORE SAVED ON BASE  ·  '+walletShort, 0, 0);
      ctx.textBaseline='alphabetic'; ctx.restore();
    } else {
      // Connect wallet CTA
      var wdp2 = 0.97+0.03*Math.sin(frame*0.10);
      ctx.save(); ctx.translate(W/2, wdy+14); ctx.scale(wdp2,wdp2);
      ctx.fillStyle='#0052FF22'; ctx.strokeStyle='#0052FF88'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(-108,-14,216,30,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#00D4FF'; ctx.font='bold 10px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💎  CONNECT WALLET  →  SAVE ON BASE', 0, 0);
      ctx.textBaseline='alphabetic'; ctx.restore();
    }
    if(shareFlash>0) shareFlash--;
  }
  ctx.restore();
  if(screenShake>0)screenShake--;
  if(shopOverlay){ drawShopOverlay(); }
  if(paused && gameState==='playing'){ ctx.fillStyle='rgba(0,5,20,.65)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.font='bold 22px Courier New'; ctx.fillStyle='#fff'; ctx.shadowColor='#0052FF'; ctx.shadowBlur=20; ctx.fillText('PAUSED',W/2,H/2); ctx.shadowBlur=0; ctx.font='11px Courier New'; ctx.fillStyle='#ffffff88'; ctx.fillText('tap ▶ or press P to resume',W/2,H/2+28); }
  if(hitFlash>0){ctx.globalAlpha=(hitFlash/8)*.38;ctx.fillStyle='#ff1133';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;hitFlash--;}
}

// ─── INPUT ───────────────────────────────────
function flap() {
  if(gameState==='idle')         { gameState='playing'; startMusic(getPhaseIdx()); combo=0; comboFlash=0; coinsThisRun=0; milestoneIdx=0; recFlash=0; phaseFlash=190; phasePaused=true; bleu.vy=0; bleu.y=H/2; }
  else if(gameState==='playing') {
    if(phasePaused){ phasePaused=false; phaseFlash=0; bleu.vy=-4; bleuSquish=6; return; } // pula animação
    bleu.vy=-7.5; bleu.flap=-1; bleuSquish=8; beep(260,520,0.09,'sine',0.16);
  }
  else if(gameState==='hurt')    { gameState='playing'; invincible=140; bleu.vy=-5; beep(440,880,0.1,'sine',0.15); }
  else if(gameState==='dead')           { resetGame(); gameState='playing'; }
}


function hitShopCard(cx, cy, yStart, compact) {
  var cols=3, tw=76, th=compact?82:80, gapX=8, gapY=compact?4:5;
  var startX=W/2-((cols*(tw+gapX)-gapX)/2);
  for(var si=1;si<SKINS.length;si++){
    var idx2=si-1, col=idx2%cols, row=Math.floor(idx2/cols);
    var sx=startX+col*(tw+gapX)+tw/2, sy=yStart+row*(th+gapY);
    if(cx>=sx-tw/2&&cx<=sx+tw/2&&cy>=sy&&cy<=sy+th) return si;
  }
  return -1;
}
function buySkin(si) {
  var sk=SKINS[si], owned=unlockedSkins.indexOf(si)>=0;
  if(owned){ activeSkin=si; localStorage.setItem('bleuSkin',''+si); beep(440+si*50,880+si*50,0.1,'sine',0.12); }
  else if(coinCount>=sk.price){
    coinCount-=sk.price; localStorage.setItem('bleuCoins',coinCount);
    unlockedSkins.push(si); localStorage.setItem('bleuSkins',JSON.stringify(unlockedSkins));
    activeSkin=si; localStorage.setItem('bleuSkin',''+si);
    beep(523,1047,0.3,'sine',0.15);
    [659,784,1047].forEach(function(f,ii){setTimeout(function(){beep(f,f,0.12,'sine',0.1);},ii*70);});
  } else { beep(220,150,0.12,'sawtooth',0.08); hitFlash=3; }
}
function handleClick(ex, ey) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = W/rect.width, scaleY = H/rect.height;
  var cx = (ex-rect.left)*scaleX, cy = (ey-rect.top)*scaleY;
  if(dailyModal){
    if(cx>=W/2-65&&cx<=W/2+65&&cy>=H/2+78&&cy<=H/2+112){ claimDailyReward(); beep(523,1047,0.2,'sine',0.14); }
    return;
  }
  if(shopOverlay){
    if(cy>=H-74&&cy<=H-38&&cx>=W/2-80&&cx<=W/2+80){ shopOverlay=false; return; }
    var si2=hitShopCard(cx,cy,76,true);
    if(si2>=0){ buySkin(si2); return; }
    return;
  }

  // ── HURT — qualquer toque retoma
  if(gameState === 'hurt') { flap(); return; }

  // ── AWARD chest click
  if(gameState === 'award') {
    if(!chestOpened) {
      chestClicks++;
      // bounce e som escalados por clique
      chestBounce = 10 + chestClicks * 8;
      var freq = 200 + chestClicks * 180;
      beep(freq, freq*2, 0.18+chestClicks*0.06, 'sawtooth', 0.18);
      if(navigator.vibrate) navigator.vibrate(30+chestClicks*40);
      if(chestClicks >= 3) {
        chestOpened = true;
        chestCoins = chestCoinsRand();
        coinCount += chestCoins;
        localStorage.setItem('bleuCoins', coinCount);
        // explosão sonora
        [523,659,784,1047,1319].forEach(function(f,i){
          setTimeout(function(){ beep(f,f*1.5,0.18,'sine',0.15); },i*70);
        });
        spawnParticles(W/2, H/2, '#FFD700', 18);
        spawnParticles(W/2, H/2, '#ffffff', 10);
        if(navigator.vibrate) navigator.vibrate([60,20,60,20,100]);
      }
    } else if(chestOpenAnim >= 26) {
      shopOverlay = true; gameState = 'playing'; startMusic(getPhaseIdx());
    }
    return;
  }

  // ── DEAD screen buttons
  if(gameState === 'dead') {
    // Botão COMPARTILHAR: H/2+122 a H/2+152
    if(cx>=W/2-74&&cx<=W/2+74&&cy>=H/2+122&&cy<=H/2+152){
      var pv2 = PHASE_VISUALS[runPhase]||PHASE_VISUALS[0];
      var shareText = '🎮 Flapy Bleu\nScore: '+score+' | '+pv2.name+'\n🔵 https://flapy-bleu.vercel.app';
      if(navigator.share){ navigator.share({title:'Flapy Bleu', text:shareText, url:'https://flapy-bleu.vercel.app'}); }
      else { try{ navigator.clipboard.writeText(shareText); }catch(e){} }
      shareFlash=90; return;
    }
    // Botão MENU: H/2+202 a H/2+228
    if(cx>=W/2-50&&cx<=W/2+50&&cy>=H/2+202&&cy<=H/2+228){
      resetGame(); idleTab='play'; return;
    }
    // Wallet line: H/2+248 a H/2+264 — conectar se não tiver wallet
    if(cx>=W/2-160&&cx<=W/2+160&&cy>=H/2+248&&cy<=H/2+264){
      if(!walletAddress) connectWallet();
      return;
    }
    // Retry — anywhere else (incluindo botão JOGAR DE NOVO)
    flap(); return;
  }

  // ── IDLE tabs click
  if(gameState === 'idle') {
    if(idleTab==='shop'){ var si3=hitShopCard(cx,cy,76,false); if(si3>=0){ buySkin(si3); return; } }
    // Leaderboard tab: botão wallet
    if(idleTab==='leaderboard'){
      var wy3=H/2+104;
      if(!walletAddress){
        // CONECTAR CARTEIRA: wy3+4 a wy3+40
        if(cx>=W/2-110&&cx<=W/2+110&&cy>=wy3+4&&cy<=wy3+40){ connectWallet(); return; }
      } else {
        // DESCONECTAR: wy3+38 a wy3+54
        if(cx>=W/2-30&&cx<=W/2+30&&cy>=wy3+38&&cy<=wy3+54){ disconnectWallet(); return; }
      }
    }
    var labels=['play','shop','skins','leaderboard'], tw=82, th=44, gap=5;
    var total=4*(tw+gap)-gap, tx0=W/2-total/2, ty=H-58;
    for(var ti=0;ti<labels.length;ti++) {
      var tx=tx0+ti*(tw+gap);
      if(cx>=tx&&cx<=tx+tw&&cy>=ty&&cy<=ty+th) {
        idleTab=labels[ti]; beep(440,660,0.08,'sine',0.1); return;
      }
    }
    // Skins tab: click to equip (only owned skins shown)
    if(idleTab==='skins') {
      var owned2=unlockedSkins.slice().sort(function(a,b){return a-b;});
      if(owned2.length===0) owned2=[0];
      var cols2=3,tw3=78,th3=92,gapX2=8,totalW3=cols2*(tw3+gapX2)-gapX2,startX2=W/2-totalW3/2;
      for(var ii2=0;ii2<owned2.length;ii2++) {
        var si2=owned2[ii2];
        var col2=ii2%cols2,row2=Math.floor(ii2/cols2);
        var sx2=startX2+col2*(tw3+gapX2)+tw3/2, sy2=H/2-100+row2*(th3+gapX2);
        if(cx>=sx2-tw3/2&&cx<=sx2+tw3/2&&cy>=sy2&&cy<=sy2+th3) {
          activeSkin=si2;
          localStorage.setItem('bleuSkin',''+si2);
          beep(440+si2*55, 880+si2*55, 0.1,'sine',0.12);
          return;
        }
      }
    }
    // Play tab — wallet button
    if(idleTab==='play' && !walletAddress) {
      var wy0c = H/2+66;
      if(cx>=W/2-100&&cx<=W/2+100&&cy>=wy0c&&cy<=wy0c+32){ connectWallet(); return; }
    }
// Character select (legacy, play tab)
    if(idleTab==='play' && unlockedChars >= 2) {
      var bx1=W/2-55, bx2=W/2+15, bby=H/2+80, bbw=40, bbh=16;
      if(cx>=bx1&&cx<=bx1+bbw&&cy>=bby&&cy<=bby+bbh){ activeChar=0; localStorage.setItem('bleuActiveChar','0'); beep(440,880,0.1,'sine',0.12); return; }
      if(cx>=bx2&&cx<=bx2+bbw&&cy>=bby&&cy<=bby+bbh){ activeChar=1; localStorage.setItem('bleuActiveChar','1'); beep(660,1320,0.1,'sine',0.12); return; }
    }
  }

  // Pause button hit (top-right corner, playing state)
  if(gameState==='playing' && cx>=W-36&&cx<=W-10&&cy>=6&&cy<=26){ paused=!paused; return; }
  if(paused) return;
  flap();
}

canvas.addEventListener('click', function(e){ handleClick(e.clientX, e.clientY); });
document.addEventListener('keydown', function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(gameState==='award'){ handleClick(canvas.getBoundingClientRect().left + W/2, canvas.getBoundingClientRect().top + H/2); return; }
    if(paused){ paused=false; return; }
    if(shopOverlay){ shopOverlay=false; gameState='playing'; startMusic(getPhaseIdx()); return; }
    flap();
  }
  if(e.code==='KeyP' && (gameState==='playing'||paused)){ paused=!paused; }
});
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); handleClick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

checkDailyLogin();
loop();
</script>
