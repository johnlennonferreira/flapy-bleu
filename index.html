// ─── BANNER DE FASE — animação dramática ──────
function drawPhaseBanner() {
  // banner só existe enquanto o jogo estiver congelado
  if(!phasePaused || phaseFlash <= 0) { phaseFlash = 0; return; }
  phaseFlash--;
  var ph = getPhase();
  var pv = getPhaseVisual();
  var t  = phaseFlash; // 190→0

  // Fases da animação:
  // 190-160: flash branco + slide entrada (30f)
  // 160-60:  exibição plena (100f)
  // 60-0:    fade out (60f)

  var fadeIn  = t > 160 ? (190-t)/30 : 1;          // 0→1 nos primeiros 30f
  var fadeOut = t < 60  ? t/60        : 1;          // 1→0 nos últimos 60f
  var alpha   = fadeIn * fadeOut;
  if(alpha <= 0) return;

  // Slide vertical: entra do topo nos primeiros 30f
  var slideY = t > 160 ? -(1-(190-t)/30)*60 : 0;

  ctx.save();
  ctx.translate(0, slideY);

  // Flash branco rápido nos primeiros 15f
  if(t > 175){
    ctx.globalAlpha = ((t-175)/15) * 0.55;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  // Overlay escuro central (sem criar gradiente — só fillRect)
  ctx.globalAlpha = alpha * 0.78;
  ctx.fillStyle = '#000510';
  ctx.beginPath(); ctx.roundRect(0, H/2-82, W, 164, 0); ctx.fill();

  // Linha colorida superior e inferior (substituem shadowBlur)
  ctx.globalAlpha = alpha;
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(0, H/2-82, W, 3);
  ctx.fillRect(0, H/2+79, W, 3);

  // Barra de cor fina no centro
  ctx.globalAlpha = alpha * 0.3;
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(0, H/2-82, W, 164);
  ctx.globalAlpha = alpha;

  // "NOVA FASE" pequeno acima
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff66';
  ctx.font = 'bold 11px Courier New';
  ctx.fillText('✦  NEW PHASE  ✦', W/2, H/2-52);

  // Label da fase (PHASE 3) — grande
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 15px Courier New';
  ctx.fillText(ph.label, W/2, H/2-32);

  // Nome da fase — fonte prime, uma única camada com glow real
  ctx.fillStyle = pv.glowColor;
  ctx.shadowColor = pv.glowColor; ctx.shadowBlur = 18 * alpha;
  ctx.font = 'bold 26px Georgia, serif';
  ctx.letterSpacing = '2px';
  ctx.globalAlpha = alpha;
  ctx.fillText(pv.name, W/2, H/2+8);
  ctx.shadowBlur = 0; ctx.letterSpacing = '0px';

  // Velocidade + barra de progresso de fase
  ctx.fillStyle = '#ffffff88';
  ctx.font = '11px Courier New';
  ctx.fillText('speed  ' + ph.speed.toFixed(1) + 'x', W/2, H/2+32);

  // Barra de progresso (fase atual / total)
  var pi = getPhaseIdx();
  var barW = 160, barH = 4, barX = W/2 - barW/2, barY = H/2+48;
  ctx.fillStyle = '#ffffff22';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = pv.glowColor;
  ctx.fillRect(barX, barY, barW * ((pi+1)/PHASES.length), barH);

  // Nível em texto abaixo da barra
  ctx.fillStyle = '#ffffff44';
  ctx.font = '9px Courier New';
  ctx.fillText((pi+1) + ' / ' + PHASES.length + ' phases', W/2, H/2+64);

  ctx.restore();
}

// ─── PARTÍCULAS ──────────────────────────────
function spawnParticles(x, y, color, n) {
  n = n || 8;
  var _maxP = _isMobile ? 10 : 18; // menos partículas no mobile
  if(particles.length > _maxP) return;
  var _cap = _isMobile ? Math.min(n, 6) : n; // spawn máximo menor no mobile
  for(var i=0; i<_cap; i++)
    particles.push({x:x, y:y, vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7, life:40, color:color});
}
function updateParticles() {
  particles = particles.filter(function(p){ return p.life>0; });
  for(var i=0; i<particles.length; i++){
    var p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
    ctx.globalAlpha = p.life/40;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── COLISÃO ─────────────────────────────────
function hitTestPipes() {
  var r = 14;
  for(var i=0; i<pipes.length; i++){
    var p = pipes[i];
    if(bleu.x+r > p.x && bleu.x-r < p.x+p.bodyW){
      if(bleu.y-r < p.topH) return true;
      if(bleu.y+r > p.botY) return true;
    }
  }
  return false;
}
function hitTest() {
  return hitTestPipes() || bleu.y+14 > H-80 || bleu.y-14 < 22;
}

// ─── LOOP PRINCIPAL ──────────────────────────
var _lastT=0;
function loop(ts) {
  requestAnimationFrame(loop);
  var dt = ts - _lastT;
  if(dt < 16) return; // cap 60fps — saves CPU/battery on 90/120Hz phones
  if(dt > 33) dt = 33; // cap máximo: evita salto físico brutal após background tab / thermal throttle
  _lastT = ts;
  frame++;
  drawBg();
  ctx.save();
  if(screenShake>0){ctx.translate((Math.random()-.5)*screenShake*2,(Math.random()-.5)*screenShake*.7);}

  // ── DAILY MODAL ──
  if(dailyModal){ ctx.restore(); drawDailyModal(); return; } // restore antes do return — evita stack leak

  // ── IDLE ──
  if(gameState === 'idle'){
    if(idleTab==='play'){
      if(!_isMobile) drawIdleParticles(); // partículas decorativas — pula no mobile
      drawCharacter(bleu.x, bleu.y + Math.sin(frame*.045)*8, frame*.22, 0);
      ctx.textAlign = 'center';

      // ── Title shadow layer ──
      ctx.font = 'bold 38px Courier New';
      ctx.fillStyle = '#001AFF44';
      ctx.fillText('FLAPY BLEU', W/2+3, H/2-79);
      // ── Title gradient ──
      var tg = ctx.createLinearGradient(W/2-90, 0, W/2+90, 0);
      tg.addColorStop(0,'#0052FF'); tg.addColorStop(0.45,'#00D4FF'); tg.addColorStop(1,'#FFD700');
      ctx.fillStyle = tg;
      ctx.shadowColor = '#0066FF'; ctx.shadowBlur = 32;
      ctx.fillText('FLAPY BLEU', W/2, H/2-82);
      ctx.shadowBlur = 0;

      // ── WEB3 GAME pill badge ──
      var badgePulse = 0.94+0.06*Math.sin(frame*0.07);
      ctx.save(); ctx.translate(W/2, H/2-58); ctx.scale(badgePulse, badgePulse);

// ─── INPUT ───────────────────────────────────
function flap() {
  if(gameState==='idle') {
    // Anti-acidente após morte: exige 2 toques para iniciar
    // 1º toque → desbloqueia (feedback visual no botão), 2º toque → inicia
    if(!menuTapReady){
      menuTapReady = true;
      beep(520, 660, 0.09, 'sine', 0.12); // feedback sonoro de confirmação
      return; // não inicia — aguarda 2º toque
    }
    gameState='playing'; startMusic(getPhaseIdx()); combo=0; comboFlash=0; coinsThisRun=0; milestoneIdx=0; recFlash=0; phaseFlash=190; phasePaused=true; bleu.vy=0; bleu.vx=0; bleu.y=H/2;
    // Aplicar itens comprados ao iniciar a run
    if(shieldStock>0){ shield=Math.min(3,shieldStock); shieldStock=0; shieldPickedUp=0; _ls.set('bleuShieldStock',0); }
    if(extraHeartStock>0){ lives=3+Math.min(extraHeartStock,2); extraHeartStock=0; _ls.set('bleuExtraHeart',0); }
    else { lives=3; }
    // slowMoStock e checkpointStock ficam disponíveis para uso em jogo
  }
  else if(gameState==='playing') {
    if(firePower > 0) return; // desgovernado — sem controle do jogador
    if(phasePaused){ if(shopOverlay) return; phasePaused=false; phaseFlash=0; bleu.vy=-4; bleuSquish=6; return; } // pula animação
    bleu.vy=-7.5; bleu.flap=0; bleuSquish=8; bleuFlapTimer=18;
    if(activeChar===1 && gengarUnlocked) {
      // PHANTOM: fart propulsion instead of wing flap
      spawnPhantomFart(bleu.x, bleu.y);
      beep(160,80,0.18,'sawtooth',0.12);
      setTimeout(function(){ beep(90,60,0.12,'sawtooth',0.08); }, 60);
    } else if(activeChar===4 && boatUnlocked) {
      // VIKING BOAT: remada + buzina nórdica grave
      beep(100,55,0.2,'sawtooth',0.14);
      setTimeout(function(){ beep(65,100,0.12,'triangle',0.1); }, 80);
    } else {
      // BLEU: wing flap sound — whoosh down then up
      beep(380,180,0.06,'triangle',0.13);
      setTimeout(function(){ beep(160,320,0.05,'triangle',0.09); }, 55);
    }
  }
  else if(gameState==='hurt')    { gameState='playing'; invincible=140; bleu.vy=-5; beep(440,880,0.1,'sine',0.15); }
  else if(gameState==='dead')    { resetGame(); gameState='playing'; startMusic(0); bleu.vy=-7.5; bleuFlapTimer=18; }
  else if(gameState==='prestige') {
    if(prestigeAnim < 40) return; // aguarda animação mínima
    resetGame(); // volta ao menu idle com badge de prestígio — jogador clica para começar
  }
  else if(gameState==='legendary') {
    if(legendaryAnim < 88) return; // aguarda revelação completa do barco
    resetGame(); // idle com barco equipado
  }
}


// hitShopCard and buySkin replaced by new fan-based shop system above
function handleClick(ex, ey) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = W/rect.width, scaleY = H/rect.height;
  var cx = (ex-rect.left)*scaleX, cy = (ey-rect.top)*scaleY;
  // Wallet badge click — desconectar carteira
  if(walletAddress && cy >= 5 && cy <= 23 && cx >= W-112 && cx <= W-27) {
    disconnectWallet(); return;
  }
  // Mute toggle — ícone de som no canto superior direito (área menor, não sobrepõe wallet)
  if(cy >= 0 && cy <= 22 && cx >= W-24 && cx <= W) {
    muted = !muted;
    document.getElementById('mute').textContent = muted ? '🔇 MUTE' : '🔊 SFX';
    if(muted){ if(_curAudio) _curAudio.pause(); if(_presAudio) _presAudio.pause(); }
    else if(_starActive){ _playAudio(_starAudio); }
    else if(gameState==='prestige'||gameState==='legendary'){ _playAudio(_presAudio); }
    else if(gameState==='playing'||gameState==='hurt') startMusic(getPhaseIdx());
    return;
  }
  if(dailyModal){
    if(cx>=W/2-65&&cx<=W/2+65&&cy>=H/2+78&&cy<=H/2+112){ claimDailyReward(); beep(523,1047,0.2,'sine',0.14); }
    return;
  }

  // ── Slow-mo: tap no card topo (y=46-66) OU no botão grande em baixo (circle r=28 em 34,H-162) ──
  if((gameState==='playing'||gameState==='hurt') && slowMoStock>0 && slowMoActive===0){
    var _smBdx=cx-34, _smBdy=cy-(H-162);
    var _smHit = (_smBdx*_smBdx+_smBdy*_smBdy<=22*22); // círculo em baixo
    if(_smHit){
      slowMoStock--; _ls.set('bleuSlowMo',slowMoStock); slowMoActive=2700;
      beep(300,600,0.18,'sine',0.14);
      beep(440,880,0.12,'sine',0.1);
      spawnParticles(bleu.x,bleu.y,'#00D4FF',14);
      spawnParticles(bleu.x,bleu.y,'#ffffff',6);
      return;
    }
  }

  // ── MID-GAME SHOP (loja entre fases) ──
  if(gameState==='playing' && shopOverlay){
    var _mgClose = function(){
      shopOverlay = false;
      if(shieldStock>0){ shield=Math.min(3,shield+shieldStock); shieldStock=0; _ls.set('bleuShieldStock',0); }
      phasePaused = false; phaseFlash = 0;
      startMusic(getPhaseIdx());
    };
    // CONTINUAR button: centered at H-78
    if(cy >= H-97 && cy <= H-59){ _mgClose(); return; }
    return; // consume all other clicks on overlay — shield só na shop/market
  }

  // ── PRESTIGE — qualquer toque após animação mínima continua
  if(gameState === 'prestige') { flap(); return; }
  // ── LEGENDARY — toque após revelação completa equipa barco e vai ao idle
  if(gameState === 'legendary') { flap(); return; }

  // ── HURT — qualquer toque retoma
  if(gameState === 'hurt') { flap(); return; }

  // ── AWARD — phase complete, two buttons
  if(gameState === 'award') {
    var btnY2 = H/2+82;
    if(cy>=btnY2-18&&cy<=btnY2+18){
      if(cx>=W/2-106&&cx<=W/2-10){ // SHOP
        gameState='idle'; idleTab='shop'; stopMusic(); beep(523,784,0.1,'sine',0.12); return;
      }
      if(cx>=W/2+10&&cx<=W/2+106){ // GO / CONTINUE
        gameState='playing'; startMusic(getPhaseIdx()); beep(659,1047,0.1,'sine',0.12); return;
      }
    }
    return;
  }

  // ── DEAD screen buttons
  if(gameState === 'dead') {
    // ── Ofertas PRIMEIRO (têm prioridade sobre share/menu na área sobreposta) ──
    if(deathOfferTimer > 0) {
      var _doY2 = H/2 + 148;
      // Botão CHECKPOINT — usar carta (sem wallet) ou comprar USDC (1× por run)
      if(cx>=W/2-110&&cx<=W/2+110&&cy>=_doY2+22&&cy<=_doY2+52){
        if(!checkpointUsed) {
          if(checkpointStock > 0) {
            // Usa carta já comprada — não requer wallet
            checkpointStock--; _ls.set('bleuCheckpoint', checkpointStock);
            checkpointUsed=true; dizzyTimer=90;
            lives=3; invincible=240; bleu.y=H/2; bleu.vy=0;
            gameState='playing'; startMusic(getPhaseIdx());
            screenShake=6; hitFlash=3; deathOfferTimer=0;
            spawnParticles(W/2,H/2,'#FFD700',18); spawnParticles(W/2,H/2,'#00D4FF',10);
            beep(440,880,0.3,'sine',0.18);
            [660,880,1047].forEach(function(f,i){setTimeout(function(){beep(f,f,0.12,'sine',0.1);},i*70);});
          } else if(walletAddress) {
            // Compra checkpoint via USDC e já usa
            sendUSDCPurchase(USDC_CHECKPOINT, function(){
              checkpointUsed=true; dizzyTimer=90;
              lives=1; invincible=220; bleu.y=H/2; bleu.vy=0;
              gameState='playing'; startMusic(getPhaseIdx());
              screenShake=6; deathOfferTimer=0;
              spawnParticles(W/2,H/2,'#FFD700',18);
              beep(440,880,0.3,'sine',0.18);
            });
          }
        }
        return;
      }
      // Botão CORAÇÃO — requer wallet, 1× por run
      if(walletAddress && !heartUsed && cx>=W/2-110&&cx<=W/2+110&&cy>=_doY2+58&&cy<=_doY2+88){
        sendUSDCPurchase(USDC_HEART, function(){
          heartUsed=true;
          lives=1; invincible=180; bleu.y=H/2; bleu.vy=0;
          gameState='playing'; startMusic(getPhaseIdx());
          deathOfferTimer=0;
          spawnParticles(W/2,H/2,'#FF6680',14);
          beep(523,880,0.2,'sine',0.14);
        });
        return;
      }
    }

    // Death chest tap (área no centro inferior)
    if(deadChest.active && !deadChest.opened && cy>=H/2+152&&cy<=H/2+224&&cx>=W/2-70&&cx<=W/2+70){
      deadChest.opened=true;
      coinCount+=deadChest.coins; _ls.set('bleuCoins',coinCount);

      spawnParticles(W/2,H/2+196,'#FFD700',14);
      if(navigator.vibrate) navigator.vibrate([30,20,60]);
      return;
    }
    // Botão COMPARTILHAR: H/2+122 a H/2+152
    if(cx>=W/2-74&&cx<=W/2+74&&cy>=H/2+122&&cy<=H/2+152){
      var pv2 = PHASE_VISUALS[runPhase]||PHASE_VISUALS[0];
      var shareText = '🎮 Flapy Bleu\nScore: '+score+' | '+pv2.name+'\n🔵 https://flapy-bleu.vercel.app';
      if(navigator.share){ navigator.share({title:'Flapy Bleu', text:shareText, url:'https://flapy-bleu.vercel.app'}); }
      else { try{ navigator.clipboard.writeText(shareText); }catch(e){} }
      shareFlash=90; return;
    }
    // Wallet line: H/2+248 a H/2+264
    if(cx>=W/2-160&&cx<=W/2+160&&cy>=H/2+248&&cy<=H/2+264){
      if(!walletAddress) connectWallet();

  }

  // ── IDLE tabs click
  if(gameState === 'idle') {
    if(idleTab==='shop'){
      // Wallet toggle top-right
      if(cx>=W-84&&cx<=W-4&&cy>=6&&cy<=26){ walletAddress ? disconnectWallet() : connectWallet(); return; }
      // Char selector tabs — só personagens desbloqueados
      var _visC=[{idx:0,u:true},{idx:1,u:gengarUnlocked},{idx:2,u:wormUnlocked},{idx:3,u:alienUnlocked}].filter(function(c){return c.u;});
      var _ctw=Math.min(110,Math.floor((W-16)/(_visC.length+0.3*(_visC.length-1)))-4), _cgap=6;
      var _ctx0=Math.round(W/2-(_visC.length*(_ctw+_cgap)-_cgap)/2);

      }
      // Fan orbs
      for(var _fi3=0;_fi3<5;_fi3++){
        var _fa3=FAN_ANGLES[_fi3]*Math.PI/180;
        var _fx3=W/2+FAN_RADIUS*Math.cos(_fa3), _fy3=CHAR_PREVIEW_Y+FAN_RADIUS*Math.sin(_fa3);

      // Action button
      var _btnY2=CHAR_PREVIEW_Y+146;
      if(cx>=W/2-76&&cx<=W/2+76&&cy>=_btnY2&&cy<=_btnY2+34){ shopBuyOrEquip(); return; }
      // USDC color buy button
      if(walletAddress){
        var _uBtnY=_btnY2+40;
        var _upC=USDC_COLOR_PRICES[shopChar]&&USDC_COLOR_PRICES[shopChar][shopSelColor];
        if(_upC&&cx>=W/2-76&&cx<=W/2+76&&cy>=_uBtnY&&cy<=_uBtnY+32){
          var _ownedC=isColorOwned(shopChar,shopSelColor);
          if(!_ownedC&&shopSelColor>0){ buyColorWithUSDC(shopChar,shopSelColor); return; }
        }
      }
      // ── ITEMS ROW — 4 cards (shield/slowmo/heart/checkpoint) — só se char desbloqueado ──
      var _charLockedClick=(shopChar===1&&!gengarUnlocked)||(shopChar===2&&!wormUnlocked)||(shopChar===3&&!alienUnlocked);
      var _ir2={y:414,w:94,h:112,gap:5};
      var _ix02=Math.round((W-(4*_ir2.w+3*_ir2.gap))/2);
      if(!_charLockedClick) for(var _ii=0;_ii<4;_ii++){
        var _icx=_ix02+_ii*(_ir2.w+_ir2.gap);
        if(cx>=_icx&&cx<=_icx+_ir2.w&&cy>=_ir2.y+68&&cy<=_ir2.y+_ir2.h){
          if(_ii===0){ // Shield — coins
            if(shieldStock>=3){ beep(220,150,0.1,'sawtooth',0.06); return; }
            if(coinCount>=80){
              coinCount-=80; if(coinCount<0)coinCount=0; _ls.set('bleuCoins',coinCount);
              shieldStock++; _ls.set('bleuShieldStock',shieldStock);
              beep(523,1047,0.22,'sine',0.13);
              [659,784].forEach(function(f,i){setTimeout(function(){beep(f,f,0.1,'sine',0.09);},i*60);});
              spawnParticles(W/2,H/2,'#00FF88',10);
            } else { beep(220,150,0.12,'sawtooth',0.08); hitFlash=3; }
          } else if(_ii===1&&walletAddress&&slowMoStock<5){ // Slow-Mo — USDC, máx 5 por run
            sendUSDCPurchase(USDC_SLOWMO, function(){
              slowMoStock = Math.min(slowMoStock+1, 5); _ls.set('bleuSlowMo',slowMoStock);
              beep(440,880,0.2,'sine',0.14); spawnParticles(W/2,H/2,'#00D4FF',14);
            });
          } else if(_ii===2&&walletAddress&&extraHeartStock<2){ // Coração — USDC
            sendUSDCPurchase(USDC_HEART, function(){
              extraHeartStock++; _ls.set('bleuExtraHeart',extraHeartStock);
              beep(523,880,0.2,'sine',0.14); spawnParticles(W/2,H/2,'#FF6680',14);
            });
          } else if(_ii===3&&walletAddress&&checkpointStock<1){ // Checkpoint — USDC
            sendUSDCPurchase(USDC_CHECKPOINT, function(){
              checkpointStock=1; _ls.set('bleuCheckpoint',1);
              beep(660,1320,0.25,'sine',0.16);
              [880,1047].forEach(function(f,i){setTimeout(function(){beep(f,f,0.12,'sine',0.1);},i*80);});
              spawnParticles(W/2,H/2,'#FFD700',18);
            });
          }
          return;
        }
      }
      // ── USDC unlock — área do botão (y 382-418, x ±90 do centro) ──
      if(!gengarUnlocked && shopChar===1 && walletAddress && cx>=W/2-90 && cx<=W/2+90 && cy>=382 && cy<=418){ unlockCharWithUSDC(1); return; }
      if(!wormUnlocked   && shopChar===2 && walletAddress && cx>=W/2-90 && cx<=W/2+90 && cy>=382 && cy<=418){ unlockCharWithUSDC(2); return; }
      if(!alienUnlocked  && shopChar===3 && walletAddress && cx>=W/2-90 && cx<=W/2+90 && cy>=382 && cy<=418){ unlockCharWithUSDC(3); return; }
    }
    // Market tab: botões USDC registrados em _marketBtns durante o draw
    if(idleTab==='market'){
      for(var _mbi=0;_mbi<_marketBtns.length;_mbi++){
        var _mb=_marketBtns[_mbi];
        if(cx>=_mb.rect.x&&cx<=_mb.rect.x+_mb.rect.w&&cy>=_mb.rect.y&&cy<=_mb.rect.y+_mb.rect.h){
          _mb.action(); beep(440,660,0.08,'sine',0.1); return;
        }
      }
    }
    // Leaderboard tab: badge wallet toggle (conecta ou desconecta com 1 toque)
    if(idleTab==='leaderboard'){
      var wy3=H/2-110;
      // Zona = badge 224×26 + hint abaixo (~36px total)
      if(cx>=W/2-112&&cx<=W/2+112&&cy>=wy3&&cy<=wy3+36){
        walletAddress ? disconnectWallet() : connectWallet(); return;
      }
    }
    var labels=['play','shop','leaderboard','market'], tw=82, th=44, gap=5;
    var total=4*(tw+gap)-gap, tx0=Math.round(W/2-total/2), ty=H-58;
    for(var ti=0;ti<labels.length;ti++) {
      var tx=tx0+ti*(tw+gap);
      if(cx>=tx&&cx<=tx+tw&&cy>=ty&&cy<=ty+th) {
        idleTab=labels[ti]; beep(440,660,0.08,'sine',0.1); return;
      }
    }
    // Play tab — wallet buttons
    if(idleTab==='play') {
      var wy0c = H/2+98;
      // TAP TO START button: H/2+50 ± 18
      if(cx>=W/2-88&&cx<=W/2+88&&cy>=H/2+32&&cy<=H/2+68){
        flap(); return;
      }
      // Wallet toggle — same button connects or disconnects
      if(cx>=W/2-100&&cx<=W/2+100&&cy>=wy0c&&cy<=wy0c+32){
        walletAddress ? disconnectWallet() : connectWallet(); return;
      }
    }
// Character select (legacy, play tab)
    if(idleTab==='play' && unlockedChars >= 2) {
      var bx1=W/2-55, bx2=W/2+15, bby=H/2+80, bbw=40, bbh=16;
      if(cx>=bx1&&cx<=bx1+bbw&&cy>=bby&&cy<=bby+bbh){ activeChar=0; _ls.set('bleuActiveChar','0'); beep(440,880,0.1,'sine',0.12); return; }
      if(cx>=bx2&&cx<=bx2+bbw&&cy>=bby&&cy<=bby+bbh){ activeChar=1; _ls.set('bleuActiveChar','1'); beep(660,1320,0.1,'sine',0.12); return; }
    }
    return; // idle: qualquer clique sem alvo não deve iniciar o jogo
  }

  // Pause button hit (top-right corner, playing state)
  if(gameState==='playing' && cx>=0&&cx<=66&&cy>=H-136&&cy<=H-72){
    paused = !paused;
    if(paused){ if(_curAudio && !_curAudio.paused) _curAudio.pause(); beep(330,280,0.07,'sine',0.08); }
    else      { if(!muted && _curAudio) _playAudio(_curAudio); beep(440,520,0.07,'sine',0.08); }
    return;
  }
  // Paused — qualquer toque em qualquer lugar retoma (mobile friendly)
  if(paused) {
    paused = false;
    if(!muted && _curAudio) _playAudio(_curAudio);
    beep(440, 520, 0.07, 'sine', 0.08);
    return;
  }
  flap();
}

canvas.addEventListener('click', function(e){ handleClick(e.clientX, e.clientY); });
document.addEventListener('keydown', function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(gameState==='award'){ handleClick(canvas.getBoundingClientRect().left + W/2, canvas.getBoundingClientRect().top + H/2); return; }
    if(paused){ paused=false; return; }
    if(shopOverlay){ shopOverlay=false; if(shieldStock>0){shield=Math.min(3,shield+shieldStock);shieldStock=0;_ls.set('bleuShieldStock',0);} phasePaused=false; phaseFlash=0; startMusic(getPhaseIdx()); return; }
    flap();
  }
  if(e.code==='KeyP' && (gameState==='playing'||paused)){ paused=!paused; }
});
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); handleClick(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

// ── MOBILE PAUSE/RESUME — visibilitychange ──────────────────────
// Quando o jogador minimiza o app, sai para outra aba ou recebe
// uma ligação, o browser suspende o jogo. Ao voltar, retomamos
// música e AudioContext automaticamente.
document.addEventListener('visibilitychange', function() {
  if(document.hidden) {
    // App foi para background: pausa jogo e música
    if(gameState === 'playing' && !paused) paused = true;
    if(_curAudio  && !_curAudio.paused)  _curAudio.pause();
    if(_presAudio && !_presAudio.paused) _presAudio.pause();
  } else {
    // App voltou para foreground
    // Retoma AudioContext (SFX) — iOS/Android suspendem automaticamente
    var _ac = getAC();
    if(_ac && _ac.state === 'suspended') _ac.resume().catch(function(){});
    // Música NÃO retoma aqui — usuário toca para retomar (paused=true)
    // Isso garante que o jogador não seja pego de surpresa
  }
});

// Fallback extra: ao focar a janela (desktop/Android Chrome)
window.addEventListener('focus', function() {
  var _ac = getAC();
  if(_ac && _ac.state === 'suspended') _ac.resume().catch(function(){});
  if(!muted && _curAudio && _curAudio.paused &&
     (gameState==='playing'||gameState==='hurt')) {
    _playAudio(_curAudio);
  }
});

checkDailyLogin();
loop();
</script>
